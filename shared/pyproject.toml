[project]
name = "signal-shared"
version = "1.0.0"
description = "Shared models, classifier and parser for the Telegram signal forwarder"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "telethon>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_shared"]
