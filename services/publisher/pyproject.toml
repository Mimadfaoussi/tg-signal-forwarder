[project]
name = "publisher"
version = "1.1.0"
description = "Reads signals from Redis and sends them to the target chat from the operator's Telegram user account"
requires-python = ">=3.12"
dependencies = [
    "signal-shared",
    "telethon>=1.36",
    "redis>=5.0",
    "asyncpg>=0.29",
    "jinja2>=3.1",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.20",
]

[tool.uv.sources]
signal-shared = { path = "../../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publisher"]
