[project]
name = "listener"
version = "1.0.0"
description = "Watches the source Telegram channel and enqueues classified signals"
requires-python = ">=3.12"
dependencies = [
    "signal-shared",
    "telethon>=1.36",
    "redis>=5.0",
    "structlog>=24.1",
]

[tool.uv.sources]
signal-shared = { path = "../../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["listener"]
